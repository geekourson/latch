name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `secrets` n'est pas lisible depuis un `if` : on le traduit une fois en
      # variable d'environnement, et les étapes testent celle-ci.
      - name: Y a-t-il de quoi signer ?
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun certificat : la release sortira non signée."
          fi

      - name: Sélectionner Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Outils de compilation
        run: |
          brew install xcodegen openssl@3
          xcodebuild -downloadComponent MetalToolchain || true

      # SPEC §7 : mosh-client est embarqué dans le bundle pour ne pas exiger
      # Homebrew de l'utilisateur. Il est compilé ici, en universel.
      - name: Compiler mosh-client
        run: Scripts/build-mosh-client.sh build/mosh arm64 x86_64

      - name: Générer le projet
        run: xcodegen generate

      - name: Compiler Latch
        run: |
          xcodebuild archive \
            -project Latch.xcodeproj \
            -scheme Latch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Latch.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Embarquer mosh-client
        run: |
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          cp build/mosh/mosh-client "$APP/Contents/MacOS/mosh-client"
          chmod 755 "$APP/Contents/MacOS/mosh-client"

      # La signature et la notarisation exigent un compte développeur Apple
      # (99 €/an). Sans les secrets, la release sort non signée : le premier
      # lancement sera alors bloqué, et il faudra passer par les Réglages
      # Système — le clic droit → Ouvrir ne marche plus depuis macOS 15.
      - name: Signer l'application
        id: sign
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP=build/Latch.xcarchive/Products/Applications/Latch.app

          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

          # Le binaire embarqué se signe d'abord : un bundle se signe de
          # l'intérieur vers l'extérieur.
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP/Contents/MacOS/mosh-client"
          codesign --force --options runtime --timestamp --deep \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # Le disque se fabrique une fois, signé ou non : seule l'app diffère. Il
      # était empaqueté deux fois, une par branche, et les deux copies ont
      # divergé dès qu'il a fallu y ajouter quelque chose.
      - name: Fabriquer le disque
        run: |
          set -euo pipefail
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          STAGE=build/dmg
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"

          # L'app à côté d'un raccourci vers Applications : c'est le geste que
          # tout le monde connaît, et il évite de lancer Latch depuis le disque
          # monté, en lecture seule.
          ln -s /Applications "$STAGE/Applications"

          # L'icône du volume, reprise de celle de l'app. Sans elle, le disque
          # monté porte l'icône générique d'un disque — et le .dmg aussi.
          cp "$APP/Contents/Resources/AppIcon.icns" "$STAGE/.VolumeIcon.icns"

          # Le fichier ne suffit pas : il faut l'attribut « icône
          # personnalisée », et il ne survit pas à une compression directe.
          # Posé sur le dossier source, GetFileInfo rend « c » minuscule après
          # coup ; posé sur le volume monté, « C ». D'où ce détour par une
          # image inscriptible, montée le temps de marquer le volume.
          hdiutil create -volname Latch -srcfolder "$STAGE" \
            -ov -format UDRW -o build/Latch-rw.dmg
          mkdir -p build/mnt
          hdiutil attach build/Latch-rw.dmg -nobrowse -mountpoint build/mnt
          SetFile -a C build/mnt
          hdiutil detach build/mnt

          hdiutil convert build/Latch-rw.dmg -format UDZO -ov -o build/Latch.dmg

          # On vérifie plutôt que d'espérer : sans le C majuscule, le disque
          # sort avec l'icône générique et personne ne s'en aperçoit avant le
          # téléchargement.
          hdiutil attach build/Latch.dmg -nobrowse -readonly -mountpoint build/verify
          GetFileInfo build/verify | grep -q 'attributes:.*C' \
            || { echo "::error::l'icône du volume n'a pas été marquée"; exit 1; }
          hdiutil detach build/verify

      - name: Signer et notariser le disque
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" build/Latch.dmg

          xcrun notarytool submit build/Latch.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple build/Latch.dmg

      # GPLv3 : le binaire mosh embarqué voyage avec ses sources et le script
      # exact qui l'a produit.
      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Latch.dmg
            build/mosh/mosh-*.tar.gz
            build/mosh/build-mosh-client.sh
            build/mosh/SHA256SUMS
          body: |
            ## Latch

            `Latch.dmg` contient l'application. Glissez-la sur **Applications**.

            Si elle n'est pas notarisée, macOS bloque le premier lancement avec
            une alerte qui ne propose que *Terminer* ou *Déplacer vers la
            corbeille*. Choisissez **Terminer**, puis **Réglages Système →
            Confidentialité et sécurité → Ouvrir quand même**.

            Le clic droit → *Ouvrir* d'autrefois ne fonctionne plus : Apple l'a
            supprimé dans macOS 15. En une ligne :

            ```
            xattr -dr com.apple.quarantine /Applications/Latch.app
            ```

            ### mosh embarqué et GPLv3

            `Latch.app/Contents/MacOS/mosh-client` provient de
            [mosh](https://mosh.org), sous **GPL-3.0-or-later**. Latch, sous
            licence MIT, se contente de le lancer comme exécutable séparé.

            Conformément à la GPLv3, cette release contient les sources exactes
            de mosh (`mosh-*.tar.gz`), le script qui l'a compilé
            (`build-mosh-client.sh`) et leurs sommes de contrôle
            (`SHA256SUMS`).
