name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `secrets` n'est pas lisible depuis un `if` : on le traduit une fois en
      # variable d'environnement, et les étapes testent celle-ci.
      - name: Y a-t-il de quoi signer ?
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun certificat : la release sortira non signée."
          fi

      - name: Sélectionner Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Outils de compilation
        run: |
          brew install xcodegen openssl@3
          xcodebuild -downloadComponent MetalToolchain || true

      # SPEC §7 : mosh-client est embarqué dans le bundle pour ne pas exiger
      # Homebrew de l'utilisateur. Il est compilé ici, en universel.
      - name: Compiler mosh-client
        run: Scripts/build-mosh-client.sh build/mosh arm64 x86_64

      - name: Générer le projet
        run: xcodegen generate

      - name: Compiler Latch
        run: |
          xcodebuild archive \
            -project Latch.xcodeproj \
            -scheme Latch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Latch.xcarchive \
            -clonedSourcePackagesDirPath build/spm \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Embarquer mosh-client
        run: |
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          cp build/mosh/mosh-client "$APP/Contents/MacOS/mosh-client"
          chmod 755 "$APP/Contents/MacOS/mosh-client"

      # Un bundle se signe de l'intérieur vers l'extérieur, et Sparkle en
      # contient plusieurs : ses services XPC, son installeur, son app de mise
      # à jour. `--deep` les signerait d'un bloc mais écraserait les
      # entitlements de Downloader.xpc ; la liste est donc explicite, dans
      # l'ordre que donne la documentation de Sparkle.
      - name: Script de signature
        run: |
          cat > build/sign-app.sh <<'SCRIPT'
          #!/bin/bash
          # sign-app.sh <identité> [options codesign…]
          set -euo pipefail
          IDENTITY="$1"; shift
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          OPTIONS=("$@")
          # bash 3.2, celui de macOS : un tableau vide est « non lié » sous -u.
          sign() { codesign --force "$@" --sign "$IDENTITY" ${OPTIONS[@]+"${OPTIONS[@]}"}; }
          sign "$APP/Contents/MacOS/mosh-client"
          sign "$SPARKLE/XPCServices/Installer.xpc"
          sign --preserve-metadata=entitlements "$SPARKLE/XPCServices/Downloader.xpc"
          sign "$SPARKLE/Autoupdate"
          sign "$SPARKLE/Updater.app"
          sign "$APP/Contents/Frameworks/Sparkle.framework"
          sign "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          SCRIPT
          chmod +x build/sign-app.sh

      # La signature et la notarisation exigent un compte développeur Apple
      # (99 €/an). Sans les secrets, la release sort non signée : le premier
      # lancement sera alors bloqué, et il faudra passer par les Réglages
      # Système — le clic droit → Ouvrir ne marche plus depuis macOS 15.
      - name: Signer l'application
        id: sign
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP=build/Latch.xcarchive/Products/Applications/Latch.app

          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain

          build/sign-app.sh "$MACOS_SIGNING_IDENTITY" --options runtime --timestamp

      # Sans certificat, l'app sortait avec la seule signature que l'éditeur de
      # liens pose sur l'exécutable : le bundle, lui, n'était « pas signé du
      # tout », sans identifiant ni Info.plist scellé. macOS n'a alors rien
      # pour reconnaître Latch d'une fois sur l'autre, et redemande l'accès à
      # Documents, au Bureau ou aux données des autres apps à chaque session
      # ouverte — c'est Latch qu'il tient pour responsable de ce que font
      # tmux, le shell ou claude. Une signature ad hoc du bundle entier suffit
      # à ce que l'accord tienne, jusqu'à la version suivante.
      - name: Signer sans certificat
        if: steps.signing.outputs.available != 'true'
        run: |
          set -euo pipefail
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          build/sign-app.sh -
          # L'exécutable seul portait l'identifiant « Latch » ; scellé, le
          # bundle prend celui de l'Info.plist.
          codesign -dv "$APP" 2>&1 | grep -qx 'Identifier=app.latch.Latch' \
            || { echo "::error::le bundle n'est pas scellé"; exit 1; }

      # Le disque se fabrique une fois, signé ou non : seule l'app diffère. Il
      # était empaqueté deux fois, une par branche, et les deux copies ont
      # divergé dès qu'il a fallu y ajouter quelque chose.
      - name: Fabriquer le disque
        run: |
          set -euo pipefail
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          STAGE=build/dmg
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"

          # L'app à côté d'un raccourci vers Applications : c'est le geste que
          # tout le monde connaît, et il évite de lancer Latch depuis le disque
          # monté, en lecture seule.
          ln -s /Applications "$STAGE/Applications"

          # L'icône du volume, reprise de celle de l'app. Sans elle, le disque
          # monté porte l'icône générique d'un disque — et le .dmg aussi.
          cp "$APP/Contents/Resources/AppIcon.icns" "$STAGE/.VolumeIcon.icns"

          # Le fichier ne suffit pas : il faut l'attribut « icône
          # personnalisée », et il ne survit pas à une compression directe.
          # Posé sur le dossier source, GetFileInfo rend « c » minuscule après
          # coup ; posé sur le volume monté, « C ». D'où ce détour par une
          # image inscriptible, montée le temps de marquer le volume.
          hdiutil create -volname Latch -srcfolder "$STAGE" \
            -ov -format UDRW -o build/Latch-rw.dmg
          mkdir -p build/mnt
          hdiutil attach build/Latch-rw.dmg -nobrowse -mountpoint build/mnt
          SetFile -a C build/mnt
          hdiutil detach build/mnt

          hdiutil convert build/Latch-rw.dmg -format UDZO -ov -o build/Latch.dmg

          # On vérifie plutôt que d'espérer : sans le C majuscule, le disque
          # sort avec l'icône générique et personne ne s'en aperçoit avant le
          # téléchargement.
          hdiutil attach build/Latch.dmg -nobrowse -readonly -mountpoint build/verify
          GetFileInfo build/verify | grep -q 'attributes:.*C' \
            || { echo "::error::l'icône du volume n'a pas été marquée"; exit 1; }
          hdiutil detach build/verify

      - name: Signer et notariser le disque
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          codesign --force --sign "$MACOS_SIGNING_IDENTITY" build/Latch.dmg

          # Un secret collé dans l'interface de GitHub garde son retour à la
          # ligne, et Apple répond alors 401 à des identifiants pourtant
          # justes. Aucun des trois ne contient d'espace : on les retire.
          NOTARY_APPLE_ID=$(printf %s "$NOTARY_APPLE_ID" | tr -d '[:space:]')
          NOTARY_PASSWORD=$(printf %s "$NOTARY_PASSWORD" | tr -d '[:space:]')
          NOTARY_TEAM_ID=$(printf %s "$NOTARY_TEAM_ID" | tr -d '[:space:]')

          xcrun notarytool submit build/Latch.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple build/Latch.dmg

      # Sparkle (voir Updater.swift) télécharge un zip de l'app, pas le disque,
      # et ne l'accepte que signé par la clé EdDSA dont l'Info.plist porte la
      # moitié publique. Le flux `appcast.xml` est publié avec la release :
      # l'URL « latest/download » de GitHub le sert toujours à jour.
      #
      # Le disque notarisé a fait enregistrer l'app chez Apple ; on agrafe ce
      # ticket à l'app elle-même, pour qu'elle passe Gatekeeper hors ligne
      # une fois sortie du disque.
      - name: Préparer la mise à jour automatique
        id: update
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY absent : pas de mise à jour automatique pour cette version."
            exit 0
          fi
          APP=build/Latch.xcarchive/Products/Applications/Latch.app
          if [ "$SIGNED" = true ]; then
            xcrun stapler staple "$APP" \
              || echo "::warning::ticket non agrafé : Gatekeeper vérifiera en ligne"
          fi

          # Le tag et l'app doivent dire la même version : Sparkle compare
          # celle du flux à `CFBundleVersion`, et un écart proposerait la
          # mise à jour en boucle.
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Contents/Info.plist")
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME, app $VERSION"; exit 1; }
          MINIMUM=$(/usr/libexec/PlistBuddy -c "Print LSMinimumSystemVersion" "$APP/Contents/Info.plist")

          ditto -c -k --sequesterRsrc --keepParent "$APP" build/Latch.zip
          SIGNATURE=$(printf %s "$SPARKLE_PRIVATE_KEY" \
            | build/spm/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file - build/Latch.zip)

          URL="https://github.com/$GITHUB_REPOSITORY/releases"
          cat > build/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Latch</title>
              <item>
                <title>Latch $VERSION</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>$MINIMUM</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>$URL/tag/$GITHUB_REF_NAME</sparkle:fullReleaseNotesLink>
                <enclosure url="$URL/download/$GITHUB_REF_NAME/Latch.zip"
                  type="application/octet-stream" $SIGNATURE />
              </item>
            </channel>
          </rss>
          XML

          # On relit ce qu'on publie : un flux mal formé, ou signé d'une autre
          # clé que celle de l'Info.plist, ne se verrait qu'à la version
          # suivante — refusée par toutes les installations, sans un mot.
          xmllint --noout build/appcast.xml
          EXPECTED=$(/usr/libexec/PlistBuddy -c "Print SUPublicEDKey" "$APP/Contents/Info.plist")
          ACTUAL=$(printf %s "$SPARKLE_PRIVATE_KEY" | swift -e '
          import CryptoKit
          import Foundation
          let seed = Data(base64Encoded: readLine()!)!
          let key = try! Curve25519.Signing.PrivateKey(rawRepresentation: seed)
          print(key.publicKey.rawRepresentation.base64EncodedString())')
          [ "$ACTUAL" = "$EXPECTED" ] \
            || { echo "::error::SPARKLE_PRIVATE_KEY ne correspond pas à SUPublicEDKey"; exit 1; }
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          printf 'build/Latch.zip\nbuild/appcast.xml\n' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Lancé à la main, sans tag, le workflow sert à essayer la signature : le
      # disque reste un artefact du run, à télécharger et lancer, sans release.
      - name: Garder le disque
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Latch-dmg
          path: build/Latch.dmg

      # GPLv3 : le binaire mosh embarqué voyage avec ses sources et le script
      # exact qui l'a produit.
      - name: Publier
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Latch.dmg
            ${{ steps.update.outputs.files }}
            build/mosh/mosh-*.tar.gz
            build/mosh/build-mosh-client.sh
            build/mosh/SHA256SUMS
          body: |
            ## Latch

            `Latch.dmg` contient l'application, signée et notarisée par Apple.
            Glissez-la sur **Applications**, puis lancez-la.

            ### mosh embarqué et GPLv3

            `Latch.app/Contents/MacOS/mosh-client` provient de
            [mosh](https://mosh.org), sous **GPL-3.0-or-later**. Latch, sous
            licence MIT, se contente de le lancer comme exécutable séparé.

            Conformément à la GPLv3, cette release contient les sources exactes
            de mosh (`mosh-*.tar.gz`), le script qui l'a compilé
            (`build-mosh-client.sh`) et leurs sommes de contrôle
            (`SHA256SUMS`).
