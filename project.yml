name: Latch

options:
  bundleIdPrefix: app.latch
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: false

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
  # Mises à jour automatiques : flux signé EdDSA, installé à la fermeture.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    # Mode langage Swift 5 volontairement : la couche PTY manipule forkpty et
    # DispatchSource, que la concurrence stricte de Swift 6 rejette sans un
    # échafaudage disproportionné pour la v0.1. À resserrer plus tard.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.12.8"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Latch:
    type: application
    platform: macOS
    sources:
      - path: Sources/Latch
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Sparkle
        product: Sparkle
    info:
      path: Generated/Info.plist
      properties:
        CFBundleName: Latch
        CFBundleDisplayName: Latch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle compare les versions par `CFBundleVersion` : figé à « 1 »,
        # il tenait toutes les releases pour identiques et n'en proposait
        # aucune. Une seule numérotation, celle qu'on lit.
        CFBundleVersion: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        # Sans cette clé, LaunchServices démarre bien le process mais AppKit
        # n'installe pas la classe principale : l'app tourne sans fenêtre ni
        # barre de menus. Lancée directement depuis un terminal, elle marche —
        # d'où un symptôme qui ne se voit qu'au double-clic.
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "MIT — Billy Girboux"
        # Pas d'agent : Latch a une fenêtre principale.
        LSUIElement: false
        # Le flux est publié avec chaque release (workflow Release). L'URL
        # « latest » de GitHub suit toujours la dernière, sans serveur.
        SUFeedURL: https://github.com/geekourson/latch/releases/latest/download/appcast.xml
        SUPublicEDKey: s6GS1AmmGKkAW3DRx2wMFuU+BST6BfXIzwg5HXP51CE=
        # Accordé d'office, sans la question que Sparkle pose au deuxième
        # lancement ; le réglage reste dans les Réglages de Latch.
        SUEnableAutomaticChecks: true
        # Téléchargée en silence, la mise à jour s'installe à la fermeture :
        # aucun onglet n'est coupé pour elle.
        SUAutomaticallyUpdate: true
    postBuildScripts:
      # SPEC §7 : les binaires publiés embarquent mosh-client. La CI le compile
      # et le pose dans build/mosh ; en local, on le prend dans Vendor/ s'il y
      # est. Sans lui, Latch retombe sur le mosh du système et le dit.
      - name: Embarquer mosh-client
        basedOnDependencyAnalysis: false
        script: |
          DESTINATION="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS/mosh-client"
          for candidate in "$SRCROOT/Vendor/mosh-client" "$SRCROOT/build/mosh/mosh-client"; do
            if [ -x "$candidate" ]; then
              install -m 755 "$candidate" "$DESTINATION"
              # Un bundle se signe de l'intérieur vers l'extérieur : sans cette
              # signature, la signature de Latch échoue sur « code object is
              # not signed at all ».
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DESTINATION"
              echo "note: mosh-client embarqué depuis $candidate"
              exit 0
            fi
          done
          echo "note: pas de mosh-client à embarquer — Scripts/build-mosh-client.sh en produit un"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.latch.Latch
        # Latch lance ssh/mosh et lit ~/.ssh/config : le bac à sable est
        # incompatible avec l'objectif. Signature locale pour le développement.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        # L'icône est dessinée par Scripts/make-icon.swift, pas peinte à la
        # main : la relancer suffit à la refaire dans toutes les tailles.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  LatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/LatchTests
    dependencies:
      - target: Latch
    postBuildScripts:
      # SPEC §7 : les binaires publiés embarquent mosh-client. La CI le compile
      # et le pose dans build/mosh ; en local, on le prend dans Vendor/ s'il y
      # est. Sans lui, Latch retombe sur le mosh du système et le dit.
      - name: Embarquer mosh-client
        basedOnDependencyAnalysis: false
        script: |
          DESTINATION="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/MacOS/mosh-client"
          for candidate in "$SRCROOT/Vendor/mosh-client" "$SRCROOT/build/mosh/mosh-client"; do
            if [ -x "$candidate" ]; then
              install -m 755 "$candidate" "$DESTINATION"
              # Un bundle se signe de l'intérieur vers l'extérieur : sans cette
              # signature, la signature de Latch échoue sur « code object is
              # not signed at all ».
              codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DESTINATION"
              echo "note: mosh-client embarqué depuis $candidate"
              exit 0
            fi
          done
          echo "note: pas de mosh-client à embarquer — Scripts/build-mosh-client.sh en produit un"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.latch.LatchTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Latch:
    build:
      targets:
        Latch: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LatchTests
